<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquipHub - Portal de Reserva de Dispositivos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --portal-ink: #263648;
      --portal-navy: #26394d;
      --portal-blue: #486580;
      --portal-line: #dce3e9;
      --portal-canvas: #f3f5f7;
      --portal-surface: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--portal-canvas);
      color: var(--portal-ink);
      letter-spacing: -0.01em;
    }
    #root {
      min-height: 100vh;
    }
    #root header {
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(31, 48, 65, 0.045);
    }
    #root main {
      padding-top: 2rem;
      padding-bottom: 2.75rem;
    }
    #root main .bg-white {
      border-color: var(--portal-line);
      box-shadow: 0 8px 24px rgba(31, 48, 65, 0.045);
    }
    #root main table {
      color: #405064;
    }
    #root main thead th {
      letter-spacing: 0.055em;
    }
    #root main tbody td {
      line-height: 1.45;
    }
    #root main .grid > div {
      transition: box-shadow 180ms ease, transform 180ms ease;
    }
    #root main .grid > div:hover {
      box-shadow: 0 14px 30px rgba(31, 48, 65, 0.1);
      transform: translateY(-2px);
    }
    #root button {
      letter-spacing: 0;
    }
    #root button:focus-visible,
    #root a:focus-visible,
    #root input:focus-visible,
    #root select:focus-visible,
    #root textarea:focus-visible {
      outline: 2px solid #6c849b;
      outline-offset: 2px;
    }
    #root input,
    #root select,
    #root textarea {
      border-color: #d5dee6;
      background-color: #fff;
    }
    #root input:focus,
    #root select:focus,
    #root textarea:focus {
      border-color: #8297aa;
      box-shadow: 0 0 0 3px rgba(72, 101, 128, 0.12);
      outline: none;
    }
    .shadow-xs {
      box-shadow: 0 4px 12px rgba(31, 48, 65, 0.045);
    }
    [class~="bg-slate-50"] {
      background-color: #f8fafb !important;
    }
    [class~="bg-slate-100"] {
      background-color: #f0f3f5 !important;
    }
    [class~="bg-slate-200"] {
      background-color: #e7ecef !important;
    }
    [class~="bg-indigo-50"] {
      background-color: #f0f4f7 !important;
    }
    [class~="bg-indigo-100"] {
      background-color: #e7edf2 !important;
    }
    [class~="bg-indigo-500"] {
      background-color: #637d96 !important;
    }
    [class~="bg-indigo-600"] {
      background-color: var(--portal-blue) !important;
    }
    [class~="bg-indigo-900"] {
      background-color: var(--portal-navy) !important;
    }
    [class~="hover:bg-indigo-700"]:hover {
      background-color: #3a566f !important;
    }
    [class~="hover:bg-indigo-100"]:hover {
      background-color: #e8eef3 !important;
    }
    [class~="text-indigo-400"] {
      color: #a9bac9 !important;
    }
    [class~="text-indigo-600"] {
      color: var(--portal-blue) !important;
    }
    [class~="text-indigo-700"] {
      color: #405d78 !important;
    }
    [class~="text-indigo-900"] {
      color: #2f465c !important;
    }
    [class~="border-indigo-200"] {
      border-color: #d0dbe4 !important;
    }
    [class~="border-indigo-800"] {
      border-color: #3d5267 !important;
    }
    [class~="border-indigo-950"] {
      border-color: #1d2c3b !important;
    }
    [class~="bg-blue-50"] {
      background-color: #edf3f7 !important;
    }
    [class~="bg-blue-100"] {
      background-color: #e1ebf2 !important;
    }
    [class~="bg-emerald-50"] {
      background-color: #eef5f1 !important;
    }
    [class~="bg-emerald-100"] {
      background-color: #e4efe8 !important;
    }
    [class~="hover:bg-emerald-100"]:hover {
      background-color: #dceae1 !important;
    }
    ::selection {
      background-color: #526d88;
      color: #fff;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @media (max-width: 640px) {
      #root main {
        padding-top: 1.25rem;
        padding-bottom: 1.75rem;
      }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Bloques Pedagógicos por Ciclo ---
    const PERIODS_BASICA = [
      { id: 'p1', label: 'Bloque 1', start: '08:15', end: '09:00' },
      { id: 'p2', label: 'Bloque 2', start: '09:00', end: '09:45' },
      { id: 'p3', label: 'Bloque 3', start: '09:45', end: '10:30' },
      { id: 'p4', label: 'Bloque 4', start: '10:30', end: '11:15' },
      { id: 'p5', label: 'Bloque 5', start: '11:15', end: '12:00' },
      { id: 'p6', label: 'Bloque 6', start: '12:00', end: '12:45' },
      { id: 'p7', label: 'Bloque 7', start: '12:45', end: '13:30' },
      { id: 'p8', label: 'Bloque 8', start: '13:35', end: '14:20' },
      { id: 'p9', label: 'Bloque 9', start: '14:20', end: '15:05' },
      { id: 'p10', label: 'Bloque 10', start: '15:05', end: '15:50' },
      { id: 'p11', label: 'Bloque 11', start: '15:50', end: '16:20' },
    ];

    const BASICA_FLOORS = [1, 2, 3];

    const PERIODS_MEDIA = [
      { id: 'm1', label: 'Bloque 1', start: '08:10', end: '08:55', color: 'bg-amber-100 border-amber-200 text-amber-900' },
      { id: 'm2', label: 'Bloque 2', start: '08:55', end: '09:40', color: 'bg-amber-100 border-amber-200 text-amber-900' },
      { id: 'm3', label: 'Bloque 3', start: '09:40', end: '10:25', color: 'bg-sky-100 border-sky-200 text-sky-900 font-semibold' },
      { id: 'm4', label: 'Bloque 4', start: '10:40', end: '11:25', color: 'bg-sky-100 border-sky-200 text-sky-900 font-semibold' },
      { id: 'm5', label: 'Bloque 5', start: '11:25', end: '12:10', color: 'bg-sky-100 border-sky-200 text-sky-900 font-semibold' },
      { id: 'm6', label: 'Bloque 6', start: '12:25', end: '13:10', color: 'bg-amber-200 border-amber-300 text-amber-950 font-semibold' },
      { id: 'm7', label: 'Bloque 7', start: '13:10', end: '13:55', color: 'bg-slate-200 border-slate-300 text-slate-800' },
      { id: 'm8', label: 'Bloque 8', start: '14:35', end: '15:20', color: 'bg-rose-100 border-rose-200 text-rose-900 font-semibold' },
      { id: 'm9', label: 'Bloque 9', start: '15:20', end: '16:05', color: 'bg-slate-200 border-slate-300 text-slate-800' },
      { id: 'm10', label: 'Bloque 10', start: '16:05', end: '16:50', color: 'bg-slate-200 border-slate-300 text-slate-800' },
    ];

    // --- Ubicaciones por Ciclo ---
    const MEDIA_SECTIONS = [
      { id: 'sec-1', title: 'PRIMER PISO SALA PROFESORES', floor: 1, tag: 'Piso 1' },
      { id: 'sec-2', title: 'SEGUNDO PISO SALA CIENCIAS', floor: 2, tag: 'Piso 2' },
      { id: 'sec-3', title: 'CARRO NOTEBOOK SALA TECNOLOGIA', floor: 2, tag: 'Carro Notebooks' },
    ];

    // Helper para obtener fechas de la semana actual
    const getMondayDate = (d = new Date()) => {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    };

    const getWeekDaysDates = (monday) => {
      const days = [];
      for (let i = 0; i < 5; i++) {
        const nextDay = new Date(monday);
        nextDay.setDate(monday.getDate() + i);
        days.push(formatISODate(nextDay));
      }
      return days; // [lun, mar, mie, jue, vie]
    };

    const formatISODate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getMonthWeeks = (monthValue) => {
      const [year, month] = monthValue.split('-').map(Number);
      const firstDay = new Date(year, month - 1, 1);
      const lastDay = new Date(year, month, 0);
      const weeks = [];
      const weekMonday = getMondayDate(firstDay);
      while (weekMonday <= lastDay) {
        weeks.push(new Date(weekMonday));
        weekMonday.setDate(weekMonday.getDate() + 7);
      }
      return weeks;
    };

    const formatWeekRange = (monday) => {
      const friday = new Date(monday);
      friday.setDate(monday.getDate() + 4);
      const startLabel = monday.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
      const endLabel = friday.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
      return `${startLabel} – ${endLabel}`;
    };

    const currentMonday = getMondayDate();
    const currentWeekDates = getWeekDaysDates(currentMonday);

    // --- Data Inicial Dispositivos ---
    const INITIAL_DEVICES = [
      {
        id: 'dev-1',
        name: 'Carro Notebooks Sala Profesores',
        category: 'Notebooks',
        cycle: 'Media',
        model: 'Carro Movil 30 Notebooks HP',
        assetTag: 'CARRO-MED-01',
        status: 'Available',
        location: 'PRIMER PISO SALA PROFESORES',
        specs: '30 HP ProBook, Core i5, 8GB RAM',
        image: 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'dev-2',
        name: 'Carro iPads Sala Ciencias',
        category: 'iPads',
        cycle: 'Media',
        model: 'Carro Movil 25 iPads 10.9"',
        assetTag: 'CARRO-MED-02',
        status: 'Available',
        location: 'SEGUNDO PISO SALA CIENCIAS',
        specs: '25 iPads 10.9" M1 + Stylus',
        image: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'dev-3',
        name: 'Carro Notebook Sala Tecnología',
        category: 'Notebooks',
        cycle: 'Media',
        model: 'Carro Movil Lenovo ThinkPad',
        assetTag: 'CARRO-MED-03',
        status: 'Available',
        location: 'CARRO NOTEBOOK SALA TECNOLOGIA',
        specs: '30 Lenovo ThinkPad i7',
        image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'dev-4',
        name: 'iPad Pro 12.9" Básica',
        category: 'iPads',
        cycle: 'Basica',
        model: 'M2 Wi-Fi 256GB',
        assetTag: 'PAD-015',
        status: 'Available',
        location: 'Laboratorio de Diseño',
        specs: 'Pantalla Liquid Retina XDR',
        image: 'https://images.unsplash.com/photo-1561154464-82e9adf32764?auto=format&fit=crop&w=600&q=80'
      }
    ];

    // Helper para poblar datos de la planilla de Media
    const createMediaReservations = () => {
      const [lun, mar, mie, jue, vie] = currentWeekDates;
      const res = [];
      let idCounter = 1000;

      const addRes = (sectionId, dateStr, periodId, user, purpose = '') => {
        const period = PERIODS_MEDIA.find(p => p.id === periodId);
        res.push({
          id: `res-${idCounter++}`,
          cycle: 'Media',
          sectionId,
          deviceId: sectionId === 'sec-1' ? 'dev-1' : sectionId === 'sec-2' ? 'dev-2' : 'dev-3',
          deviceName: sectionId === 'sec-1' ? 'Carro Notebooks Sala Profesores' : sectionId === 'sec-2' ? 'Carro iPads Sala Ciencias' : 'Carro Notebook Sala Tecnología',
          assetTag: sectionId === 'sec-1' ? 'CARRO-MED-01' : sectionId === 'sec-2' ? 'CARRO-MED-02' : 'CARRO-MED-03',
          user,
          department: 'Educación Media',
          startDate: dateStr,
          endDate: dateStr,
          startTime: period ? period.start : '08:10',
          endTime: period ? period.end : '08:55',
          periodId,
          purpose: purpose || `Reserva Horario Media - ${user}`,
          status: 'Active'
        });
      };

      // 1. PRIMER PISO SALA PROFESORES
      // Martes
      addRes('sec-1', mar, 'm1', 'Valentina Young');
      addRes('sec-1', mar, 'm2', 'Valentina Young');
      addRes('sec-1', mar, 'm4', 'Javiera Catrón');
      addRes('sec-1', mar, 'm5', 'Javiera Catrón');
      addRes('sec-1', mar, 'm6', 'Constanza Pozo');
      addRes('sec-1', mar, 'm7', 'Constanza Pozo');
      addRes('sec-1', mar, 'm9', 'Andrea Vilca');
      addRes('sec-1', mar, 'm10', 'Javier Rodríguez');

      // Miércoles
      addRes('sec-1', mie, 'm1', 'Constanza Pozo');
      addRes('sec-1', mie, 'm2', 'Constanza Pozo');
      addRes('sec-1', mie, 'm3', 'Javier Rodríguez');
      addRes('sec-1', mie, 'm4', 'Constanza Pozo');
      addRes('sec-1', mie, 'm5', 'Constanza Pozo');
      addRes('sec-1', mie, 'm8', 'Pamela Castillo');
      addRes('sec-1', mie, 'm9', 'Pamela Castillo');

      // Jueves
      addRes('sec-1', jue, 'm1', 'Constanza Pozo');
      addRes('sec-1', jue, 'm2', 'Constanza Pozo');
      addRes('sec-1', jue, 'm4', 'Constanza Pozo');
      addRes('sec-1', jue, 'm5', 'Constanza Pozo');
      addRes('sec-1', jue, 'm6', 'Constanza Pozo');
      addRes('sec-1', jue, 'm7', 'Constanza Pozo');
      addRes('sec-1', jue, 'm8', 'Carla Leiva');
      addRes('sec-1', jue, 'm9', 'Carla Leiva');

      // Viernes
      addRes('sec-1', vie, 'm1', 'Constanza Pozo');
      addRes('sec-1', vie, 'm2', 'Constanza Pozo');
      addRes('sec-1', vie, 'm6', 'Evelyn Orellana');
      addRes('sec-1', vie, 'm7', 'Evelyn Orellana');
      addRes('sec-1', vie, 'm8', 'Javier Rodríguez');

      // 2. SEGUNDO PISO SALA CIENCIAS
      // Lunes
      addRes('sec-2', lun, 'm3', 'Andrea Vilca');
      addRes('sec-2', lun, 'm5', 'Javier Rodríguez');

      // Martes
      addRes('sec-2', mar, 'm7', 'Javier Rodríguez');
      addRes('sec-2', mar, 'm8', 'Javier Rodríguez');

      // Miércoles
      addRes('sec-2', mie, 'm1', 'Javier Rodríguez');
      addRes('sec-2', mie, 'm3', 'Romina Galarce');
      addRes('sec-2', mie, 'm4', 'Romina Galarce');
      addRes('sec-2', mie, 'm5', 'Romina Galarce');

      // Jueves
      addRes('sec-2', jue, 'm1', 'Javier Rodríguez');
      addRes('sec-2', jue, 'm3', 'Romina Galarce');
      addRes('sec-2', jue, 'm4', 'Romina Galarce');
      addRes('sec-2', jue, 'm5', 'Alejandra Riveros');
      addRes('sec-2', jue, 'm6', 'Carolina Sánchez');
      addRes('sec-2', jue, 'm7', 'Carolina Sánchez');

      // Viernes
      addRes('sec-2', vie, 'm3', 'Javier Rodríguez');
      addRes('sec-2', vie, 'm4', 'Javier Rodríguez');

      // 3. CARRO NOTEBOOK SALA TECNOLOGIA
      // Lunes
      ['m1','m2','m3','m4','m5','m8','m9','m10'].forEach(pId => addRes('sec-3', lun, pId, 'Marbel Schoess'));
      addRes('sec-3', lun, 'm6', 'Jacqueline Inostrosa');
      addRes('sec-3', lun, 'm7', 'Jacqueline Inostrosa');

      // Martes (Completo)
      PERIODS_MEDIA.forEach(p => addRes('sec-3', mar, p.id, 'Marbel Schoess'));

      // Miércoles
      addRes('sec-3', mie, 'm1', 'Valentina Young');
      addRes('sec-3', mie, 'm6', 'Valentina Young');
      addRes('sec-3', mie, 'm7', 'Valentina Young');
      addRes('sec-3', mie, 'm8', 'Javiera Catrón');
      addRes('sec-3', mie, 'm9', 'Javiera Catrón');

      // Jueves
      addRes('sec-3', jue, 'm4', 'Valentina Young');
      addRes('sec-3', jue, 'm5', 'Valentina Young');

      return res;
    };

    const INITIAL_RESERVATIONS = createMediaReservations();
    const RESERVATIONS_STORAGE_KEY = 'equiphub-basic-reservations-v1';

    const loadBasicReservations = () => {
      try {
        const savedReservations = window.localStorage.getItem(RESERVATIONS_STORAGE_KEY);
        if (savedReservations === null) {
          return INITIAL_RESERVATIONS.filter(reservation => reservation.cycle === 'Basica');
        }

        const parsedReservations = JSON.parse(savedReservations);
        if (!Array.isArray(parsedReservations) || parsedReservations.some(reservation =>
          !reservation || typeof reservation !== 'object' ||
          typeof reservation.id !== 'string' ||
          typeof reservation.startDate !== 'string' ||
          typeof reservation.periodId !== 'string'
        )) {
          throw new Error('El formato de las reservas guardadas no es válido.');
        }
        return parsedReservations.filter(reservation => reservation.cycle === 'Basica');
      } catch (error) {
        console.error('No se pudieron cargar las reservas guardadas en este navegador.', error);
        return INITIAL_RESERVATIONS.filter(reservation => reservation.cycle === 'Basica');
      }
    };

    const CATEGORIES = ['Todos', 'iPads', 'Notebooks', 'AppleTV'];

    // --- Componente Icon Helper ---
    function Icon({ name, className = "w-4 h-4" }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    }

    // --- App Principal ---
    function App() {
      const cycle = 'Basica';
      const [viewMode, setViewMode] = useState('matrix'); // 'matrix' | 'list'
      const [devices, setDevices] = useState(INITIAL_DEVICES);
      const [reservations, setReservations] = useState(loadBasicReservations);
      const [currentTab, setCurrentTab] = useState('my-reservations');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [bookingModalOpen, setBookingModalOpen] = useState(false);
      const [selectedDeviceForBooking, setSelectedDeviceForBooking] = useState(null);
      const [presetBookingData, setPresetBookingData] = useState(null);

      const [deviceModalOpen, setDeviceModalOpen] = useState(false);
      const [editingDevice, setEditingDevice] = useState(null);

      const [selectedWeekMonday, setSelectedWeekMonday] = useState(currentMonday);
      const [selectedMonth, setSelectedMonth] = useState(() =>
        `${currentMonday.getFullYear()}-${String(currentMonday.getMonth() + 1).padStart(2, '0')}`
      );

      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(RESERVATIONS_STORAGE_KEY, JSON.stringify(reservations));
        } catch (error) {
          console.error('No se pudieron guardar las reservas en este navegador.', error);
          showToast('No se pudieron guardar los cambios en este navegador. No actualices la página y revisa el almacenamiento disponible.', 'error');
        }
      }, [reservations]);

      const cycleLabel = 'Educación Básica';

      const filteredDevices = useMemo(() => {
        return devices.filter(device => {
          const matchesCycle = !device.cycle || device.cycle === cycle;
          const matchesCategory = selectedCategory === 'Todos' || device.category === selectedCategory;
          const matchesSearch = device.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                device.assetTag.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                device.model.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCycle && matchesCategory && matchesSearch;
        });
      }, [devices, selectedCategory, searchQuery, cycle]);

      const getStatusBadge = (status) => {
        switch (status) {
          case 'Available':
            return (
              <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Disponible
              </span>
            );
          case 'Reserved':
            return (
              <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">
                <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                Reservado
              </span>
            );
          case 'Maintenance':
            return (
              <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                Mantenimiento
              </span>
            );
          default:
            return null;
        }
      };

      const openBookingModal = (device, preset = null) => {

          reservation.cycle === cycle &&
          reservation.status === 'Active' &&
          reservation.startDate === bookingData.startDate &&
          reservation.periodId === bookingData.periodId &&
          (cycle === 'Basica'
            ? Number(reservation.floor) === Number(bookingData.floor)
            : reservation.sectionId === bookingData.sectionId)
        );
        if (hasConflict) {
          showToast('Ese bloque ya está reservado en el piso o planilla seleccionado.', 'error');
          return;
        }

        const newReservation = {
          id: `res-${Date.now()}`,
          cycle,
          deviceId: selectedDeviceForBooking ? selectedDeviceForBooking.id : 'dev-1',
          deviceName: selectedDeviceForBooking ? selectedDeviceForBooking.name : 'Dispositivo Tecnológico',
          assetTag: selectedDeviceForBooking ? selectedDeviceForBooking.assetTag : 'EQ-001',
          ...bookingData,
          status: 'Active'

        setReservations([newReservation, ...reservations]);
        setBookingModalOpen(false);
        setPresetBookingData(null);
        showToast(`Reserva realizada para ${bookingData.user}`);
      };

      const handleCancelReservation = (reservationId) => {
        setReservations(reservations.map(r =>
          r.id === reservationId ? { ...r, status: 'Cancelled' } : r
        ));
        showToast('Reserva cancelada correctamente.', 'info');
      };

      const handleAssignReservationFloor = (reservationId, floor) => {
        const selectedFloor = Number(floor);
        const reservation = reservations.find(r => r.id === reservationId);
        if (!reservation || !BASICA_FLOORS.includes(selectedFloor)) return false;
        const hasConflict = reservations.some(r =>
          r.id !== reservationId &&
          r.cycle === 'Basica' &&
          r.status === 'Active' &&
          Number(r.floor) === selectedFloor &&
          r.startDate === reservation.startDate &&
          r.periodId === reservation.periodId
        );
        if (hasConflict) {
          showToast('Ese bloque ya está reservado en el piso seleccionado.', 'error');
          return false;
        }
        setReservations(reservations.map(r =>
          r.id === reservationId ? { ...r, floor: selectedFloor } : r

        showToast('Piso asignado a la reserva.');
        return true;

        if (editingDevice) {
          setDevices(devices.map(d => d.id === editingDevice.id ? { ...deviceData, id: editingDevice.id } : d));

            cycle,

            image: deviceData.image || 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=600&q=80'

                            </div>
                            <div className="overflow-x-auto custom-scrollbar">
                              <table className="w-full min-w-[760px] text-left border-collapse text-xs" aria-label={`Planilla de reservas de Educación Básica, Piso ${floor}`}>
                                <thead>
                                  <tr className="bg-indigo-900 text-white font-extrabold text-[11px] uppercase">
                                    <th className="p-2.5 w-28 text-center border-r border-indigo-800">Bloque</th>
                                    {['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'].map((day, index) => {
                                      const date = new Date(`${weekDates[index]}T00:00:00`);
                                      return (
                                        <th key={day} className={`p-2.5 w-1/5 text-center ${index < 4 ? 'border-r border-indigo-800' : ''}`}>
                                          <span className="block">{day}</span>
                                          <span className="block text-[10px] font-medium normal-case text-indigo-200">
                                            {date.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' })}
                                          </span>
                                        </th>
                                      );
                                    })}
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-300">
                                  {PERIODS_BASICA.map(period => (
                                    <tr key={period.id} className="even:bg-slate-50/70 hover:bg-indigo-50/60 transition-colors">
                                      <td className="p-2 font-bold text-center border-r border-slate-300 bg-amber-100 text-amber-950 text-[11px]">
                                        {period.start} - {period.end}
                                      </td>
                                      {weekDates.map(dateStr => {
                                        const reservation = reservations.find(r =>
                                          r.cycle === 'Basica' &&
                                          Number(r.floor) === floor &&
                                          r.startDate === dateStr &&
                                          r.periodId === period.id &&
                                          r.status === 'Active'
                                        );
                                        return (
                                          <td
                                            key={dateStr}
                                            className={`p-2 border-r border-slate-300 text-center font-medium transition-colors ${
                                              reservation ? 'bg-blue-50/90 text-slate-900' : 'bg-emerald-50/50 text-slate-600'
                                            }`}
                                          >
                                            {reservation ? (
                                              <div className="flex flex-col items-center">
                                                <span className="font-bold text-slate-900">{reservation.user}</span>
                                                {reservation.purpose && <span className="text-[10px] text-indigo-700 truncate max-w-[150px]">{reservation.purpose.replace(/^\[.*?\]\s*/, '')}</span>}
                                              </div>
                                            ) : (
                                              <button
                                                type="button"
                                                onClick={() => openBookingModal(
                                                  devices.find(device => device.cycle === 'Basica') || devices.find(device => !device.cycle) || devices[0],
                                                  { date: dateStr, period, floor }
                                                )}
                                                aria-label={`Reservar en Educación Básica, Piso ${floor}, ${period.label}, ${dateStr}`}
                                                className="inline-flex items-center gap-1 rounded px-1 py-1 text-emerald-800 font-bold text-[10px] hover:text-emerald-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                                              >
                                                <Icon name="plus-circle" className="w-3 h-3" />
                                                Disponible · Reservar
                                              </button>
                                            )}
                                          </td>
                                        );
                                      })}
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </section>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* VISTA LISTA DE RESERVAS */}
                {viewMode === 'list' && (
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    {cycle === 'Basica' ? (
                      <div className="p-4 space-y-4">
                        {BASICA_FLOORS.map(floor => {
                          const floorReservations = reservations.filter(
                            reservation => reservation.cycle === 'Basica' &&
                              Number(reservation.floor) === floor
                          );
                          return (
                            <section key={floor} className="rounded-xl border border-slate-200 overflow-hidden" aria-labelledby={`basica-list-floor-${floor}`}>
                              <div className="flex justify-between items-center bg-slate-50 px-4 py-3 border-b border-slate-200">
                                <h3 id={`basica-list-floor-${floor}`} className="text-sm font-extrabold text-slate-800">Piso {floor}</h3>
                                <span className="text-xs font-semibold text-slate-500">{floorReservations.length} reserva{floorReservations.length === 1 ? '' : 's'}</span>
                              </div>
                              {floorReservations.length > 0 ? (
                                <div className="divide-y divide-slate-100">{floorReservations.map(renderReservationListItem)}</div>
                              ) : (
                                <p className="px-4 py-3 text-xs text-slate-500">Sin reservas registradas en este piso.</p>
                              )}
                            </section>
                          );
                        })}
                        {basicaReservationsWithoutFloor.length > 0 && (
                          <section className="rounded-xl border border-amber-200 overflow-hidden" aria-labelledby="basica-list-unassigned">
                            <div className="flex justify-between items-center bg-amber-50 px-4 py-3 border-b border-amber-200">
                              <h3 id="basica-list-unassigned" className="text-sm font-extrabold text-amber-950">Sin piso asignado</h3>
                              <span className="text-xs font-semibold text-amber-800">{basicaReservationsWithoutFloor.length} reserva{basicaReservationsWithoutFloor.length === 1 ? '' : 's'}</span>
                            </div>
                            <div className="divide-y divide-amber-100">{basicaReservationsWithoutFloor.map(renderReservationListItem)}</div>
                          </section>
                        )}
                      </div>
                    ) : (
                      <div className="divide-y divide-slate-100">
                        {reservations.filter(r => r.cycle === cycle).map(renderReservationListItem)}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* PESTAÑA: CATÁLOGO */}
            {currentTab === 'catalog' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
                  <div className="relative flex-1">
                    <Icon name="search" className="w-5 h-5 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400" />
                    <input
                      type="text"
                      placeholder="Buscar equipo o sala..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm"
                    />
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto">
                    {CATEGORIES.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold ${
                          selectedCategory === cat ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredDevices.map(device => (
                    <div key={device.id} className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
                      <div className="h-44 bg-slate-100 relative">
                        <img src={device.image} alt={device.name} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://placehold.co/600x400'; }} />
                        <div className="absolute top-3 right-3">{getStatusBadge(device.status)}</div>
                      </div>
                      <div className="p-5 space-y-3 flex-1 flex flex-col justify-between">
                        <div>
                          <span className="text-xs font-extrabold text-indigo-600 uppercase">{device.category}</span>
                          <h3 className="font-bold text-slate-900 text-base">{device.name}</h3>
                          <p className="text-xs text-slate-500">{device.specs}</p>
                        </div>
                        <button
                          onClick={() => openBookingModal(device)}
                          className="w-full py-2.5 rounded-xl font-bold text-xs bg-indigo-600 hover:bg-indigo-700 text-white transition-all"
                        >
                          Reservar para Educación Básica
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PESTAÑA: INVENTARIO */}
            {currentTab === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-slate-900">Inventario Tecnológico — Educación Básica</h2>
                  <button
                    onClick={() => { setEditingDevice(null); setDeviceModalOpen(true); }}
                    className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    Nuevo Dispositivo
                  </button>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                  <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full min-w-[760px] text-left text-xs">
                    <thead className="bg-slate-50 text-slate-700 uppercase font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-4">Nombre</th>
                        <th className="p-4">Categoría</th>
                        <th className="p-4">Código</th>
                        <th className="p-4">Ubicación</th>
                        <th className="p-4">Estado</th>
                        <th className="p-4 text-right">Acciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {devices.filter(dev => !dev.cycle || dev.cycle === cycle).map(dev => (
                        <tr key={dev.id} className="hover:bg-slate-50">
                          <td className="p-4 font-bold text-slate-900">{dev.name}</td>
                          <td className="p-4">{dev.category}</td>
                          <td className="p-4 font-mono font-bold">{dev.assetTag}</td>
                          <td className="p-4">{dev.location}</td>
                          <td className="p-4">{getStatusBadge(dev.status)}</td>
                          <td className="p-4 text-right">
                            <button
                              onClick={() => { setEditingDevice(dev); setDeviceModalOpen(true); }}
                              className="text-indigo-600 hover:underline font-bold"
                            >
                              Editar
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal de Reserva */}
          {bookingModalOpen && (
            <BookingModal
              device={selectedDeviceForBooking}
              presetData={presetBookingData}
              existingReservations={reservations}
              onClose={() => setBookingModalOpen(false)}
              onSubmit={handleCreateBooking}
            />
          )}

          {/* Modal Formulario Dispositivo */}
          {deviceModalOpen && (
            <DeviceFormModal
              device={editingDevice}
              onClose={() => setDeviceModalOpen(false)}
              onSubmit={handleSaveDevice}
            />
          )}
        </div>
      );
    }

    // --- Componente Modal Reserva de Educación Básica ---
    function BookingModal({ device, presetData, onClose, onSubmit }) {
      const [user, setUser] = useState('');
      const [purpose, setPurpose] = useState('');
      const periods = PERIODS_BASICA;

      const [selectedDate, setSelectedDate] = useState(presetData?.date || currentWeekDates[0]);
      const [selectedPeriod, setSelectedPeriod] = useState(presetData?.period || periods[0]);
      const [selectedFloor, setSelectedFloor] = useState(presetData?.floor ? String(presetData.floor) : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!user.trim() || !BASICA_FLOORS.includes(Number(selectedFloor))) return;

        onSubmit({
          user,
          floor: Number(selectedFloor),
          startDate: selectedDate,
          endDate: selectedDate,
          startTime: selectedPeriod.start,
          endTime: selectedPeriod.end,
          periodId: selectedPeriod.id,
          purpose: `[${selectedPeriod.label}] ${purpose || 'Clase regular'}`
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <div>
                <h3 className="font-extrabold text-base text-slate-900">Reserva de Horario — Educación Básica</h3>
                <p className="text-xs text-slate-500">{device?.name || 'Recurso Tecnológico'}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nombre del Profesor / Solicitante</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Constanza Pozo"
                  value={user}
                  onChange={(e) => setUser(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 font-medium"
                />
              </div>

              <div>
                <label htmlFor="booking-floor" className="block font-bold text-slate-700 mb-1">Piso de la reserva</label>
                <select
                  id="booking-floor"
                  required
                  value={selectedFloor}
                  onChange={(e) => setSelectedFloor(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-slate-200 font-semibold"
                >
                  <option value="" disabled>Selecciona el piso</option>
                  {BASICA_FLOORS.map(floor => (
                    <option key={floor} value={floor}>Piso {floor}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Fecha</label>
                  <input
                    type="date"
                    required
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-slate-200 font-semibold"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Bloque Pedagógico</label>
                  <select
                    value={selectedPeriod.id}
                    onChange={(e) => setSelectedPeriod(periods.find(p => p.id === e.target.value))}
                    className="w-full p-2.5 rounded-xl border border-slate-200 font-semibold"
                  >
                    {periods.map(p => (
                      <option key={p.id} value={p.id}>{p.label} ({p.start} - {p.end})</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Asignatura / Actividad</label>
                <textarea
                  rows="2"
                  placeholder="Ej: Pruebas de Salud Mental 15 iPads..."
                  value={purpose}
                  onChange={(e) => setPurpose(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-slate-200 font-medium"
                ></textarea>
              </div>

              <div className="pt-3 flex justify-end gap-2 border-t">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl font-bold text-slate-600 hover:bg-slate-100">
                  Cancelar
                </button>
                <button type="submit" className="px-4 py-2 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">
                  Confirmar Reserva
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Componente Modal Formulario Dispositivo ---
    function DeviceFormModal({ device, onClose, onSubmit }) {
      const [formData, setFormData] = useState(device || {
        name: '',
        category: 'Notebooks',
        model: '',
        assetTag: '',
        status: 'Available',
        location: '',
        specs: '',
        image: ''
      });

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 className="font-extrabold text-base text-slate-900">{device ? 'Editar Dispositivo' : 'Nuevo Dispositivo'}</h3>
            <form onSubmit={(e) => { e.preventDefault(); onSubmit(formData); }} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold mb-1">Nombre</label>
                <input
                  type="text"
                  required
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full p-2 rounded-xl border"
                />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block font-bold mb-1">Categoría</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full p-2 rounded-xl border"
                  >
                    {CATEGORIES.filter(c => c !== 'Todos').map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-bold mb-1">Código</label>
                  <input
                    type="text"
                    required
                    value={formData.assetTag}
                    onChange={(e) => setFormData({ ...formData, assetTag: e.target.value })}
                    className="w-full p-2 rounded-xl border font-mono"
                  />
                </div>
              </div>
              <div className="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl font-bold text-slate-600">Cancelar</button>
                <button type="submit" className="px-4 py-2 rounded-xl font-bold bg-indigo-600 text-white">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
