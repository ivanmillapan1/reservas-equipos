                                <th className="p-3.5 border-r border-slate-200">Lunes</th>
                                <th className="p-3.5 border-r border-slate-200">Martes</th>
                                <th className="p-3.5 border-r border-slate-200">Miércoles</th>
                                <th className="p-3.5 border-r border-slate-200">Jueves</th>
                                <th className="p-3.5">Viernes</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {table.blocks.map((b, idx) => {
                                const rowInfo = basicaData[table.dataKey][b] || {};
                                const bgBlock = idx < 2 ? 'bg-amber-100' : idx < 5 ? 'bg-blue-100' : 'bg-orange-100';
                                return (
                                  <tr key={b} className="hover:bg-slate-50">
                                    <td className={`p-3 font-bold border-r border-slate-200 ${bgBlock}`}>{b}</td>
                                    <td className="p-3 text-center font-bold border-r border-slate-200">{table.piso}</td>
                                    <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.lunes || ''}</td>
                                    <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.martes || ''}</td>
                                    <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.miercoles || ''}</td>
                                    <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.jueves || ''}</td>
                                    <td className="p-3 font-medium text-slate-800">{rowInfo.viernes || ''}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* PLANILLAS EDUCACIÓN MEDIA */}
                {currentCycle === 'media' && (
                  <div className="space-y-10">
                    {[
                      { title: 'PRIMER PISO - SALA PROFESORES', piso: 1, dataKey: 'salaProf' },
                      { title: 'SEGUNDO PISO - SALA CIENCIAS', piso: 2, dataKey: 'salaCiencias' },
                      { title: 'CARRO NOTEBOOK - SALA TECNOLOGÍA', piso: 2, dataKey: 'carroTecno' }
                    ].map(table => {
                      const mediaBlocks = ['08:10 a 08:55', '08:55 a 09:40', '09:40 a 10:25', '10:40 a 11:25', '11:25 a 12:10', '12:25 a 13:10', '13:10 a 13:55', '14:35 a 15:20', '15:20 a 16:05', '16:05 a 16:50'];
                      return (
                        <div key={table.title} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                          <div className="bg-indigo-900 text-white px-6 py-3 font-bold text-sm tracking-wide">
                            {table.title}
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-700">
                              <thead className="bg-slate-100 font-semibold border-b border-slate-200 uppercase">
                                <tr>
                                  <th className="p-3.5 border-r border-slate-200">Bloque</th>
                                  <th className="p-3.5 border-r border-slate-200 text-center">Piso</th>
                                  <th className="p-3.5 border-r border-slate-200">Lunes</th>
                                  <th className="p-3.5 border-r border-slate-200">Martes</th>
                                  <th className="p-3.5 border-r border-slate-200">Miércoles</th>
                                  <th className="p-3.5 border-r border-slate-200">Jueves</th>
                                  <th className="p-3.5">Viernes</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {mediaBlocks.map((b, idx) => {
                                  const rowInfo = mediaData[table.dataKey][b] || {};
                                  const bgBlock = idx < 2 ? 'bg-amber-100' : idx < 5 ? 'bg-blue-100' : 'bg-orange-100';
                                  return (
                                    <tr key={b} className="hover:bg-slate-50">
                                      <td className={`p-3 font-bold border-r border-slate-200 ${bgBlock}`}>{b}</td>
                                      <td className="p-3 text-center font-bold border-r border-slate-200">{table.piso}</td>
                                      <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.lunes || ''}</td>
                                      <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.martes || ''}</td>
                                      <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.miercoles || ''}</td>
                                      <td className="p-3 border-r border-slate-200 font-medium text-slate-800">{rowInfo.jueves || ''}</td>
                                      <td className="p-3 font-medium text-slate-800">{rowInfo.viernes || ''}</td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 3: INVENTARIO Y GESTIÓN */}
            {currentTab === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Inventario de Dispositivos</h2>
                    <p className="text-xs text-slate-500">Administra el inventario asignado al colegio.</p>
                  </div>
                  <button
                    onClick={() => { setEditingDevice(null); setDeviceModalOpen(true); }}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm flex items-center gap-2 transition-colors"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    Agregar Dispositivo
                  </button>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-600">
                      <thead className="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
                        <tr>
                          <th className="p-4">Dispositivo</th>
                          <th className="p-4">Categoría</th>
                          <th className="p-4">Código / Tag</th>
                          <th className="p-4">Ubicación</th>
                          <th className="p-4">Estado</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {devices.map(device => (
                          <tr key={device.id} className="hover:bg-slate-50">
                            <td className="p-4 font-semibold text-slate-900 flex items-center gap-3">
                              <img src={device.image} className="w-8 h-8 rounded-lg object-cover bg-slate-100" onError={(e) => e.target.src='https://placehold.co/100x100'} />
                              {device.name}
                            </td>
                            <td className="p-4 font-medium">{device.category}</td>
                            <td className="p-4 font-mono">{device.assetTag}</td>
                            <td className="p-4">{device.location}</td>
                            <td className="p-4">{getStatusBadge(device.status)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal de Reserva */}
          {bookingModalOpen && selectedDeviceForBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900">Reservar {selectedDeviceForBooking.name}</h3>
                  <button onClick={() => setBookingModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleBookingSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Tu Nombre</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="Ej. Juan Pérez" 
                      value={bookingName}
                      onChange={(e) => setBookingName(e.target.value)}
                      className="w-full text-xs p-2.5 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Correo Institucional</label>
                    <input 
                      type="email" 
                      required 
                      placeholder="ej. jperez@colegio.cl" 
                      value={bookingEmail}
                      onChange={(e) => setBookingEmail(e.target.value)}
                      className="w-full text-xs p-2.5 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Motivo / Asignatura</label>
                    <textarea 
                      required 
                      rows="2" 
                      placeholder="Ej: Uso de app para Geometría..." 
                      value={bookingReason}
                      onChange={(e) => setBookingReason(e.target.value)}
                      className="w-full text-xs p-2.5 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setBookingModalOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-600">Cancelar</button>
                    <button type="submit" className="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow transition-colors">Confirmar Reserva</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
